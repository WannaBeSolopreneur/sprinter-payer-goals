name: payer_goals
version: "1.0.0"
config-version: 2
profile: payer_goals
require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  example_payer_id: "payer_harborline"

models:
  payer_goals:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    spine:
      +materialized: view
      +schema: spine
